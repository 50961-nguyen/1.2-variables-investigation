name: Autograding Tests

on:
  push:
  workflow_dispatch:
  repository_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Header comments (author and date)
        id: header-comments
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Header comments (author and date)
          setup-command: ""
          command: python -m pytest test_var_investigate.py::test_header_comments -q
          timeout: 5
          max-score: 1

      - name: Variable count
        id: var-count
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Variable count
          setup-command: ""
          command: python -m pytest test_var_investigate.py::test_var_count -q
          timeout: 5
          max-score: 3

      - name: Story changed
        id: story-changed
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Story changed
          setup-command: ""
          command: python -m pytest test_var_investigate.py::test_story_changed -q
          timeout: 5
          max-score: 3

      - name: New variables used
        id: new-variables-used
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: New variables used
          setup-command: ""
          command: python -m pytest test_var_investigate.py::test_new_variables_used -q
          timeout: 5
          max-score: 3

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          HEADER-COMMENTS_RESULTS: "${{steps.header-comments.outputs.result}}"
          VAR-COUNT_RESULTS: "${{steps.var-count.outputs.result}}"
          STORY-CHANGED_RESULTS: "${{steps.story-changed.outputs.result}}"
          NEW-VARIABLES-USED_RESULTS: "${{steps.new-variables-used.outputs.result}}"
        with:
          runners: header-comments,var-count,story-changed,new-variables-used
